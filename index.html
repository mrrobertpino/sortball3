<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>sortball · Day 3 Demo</title>
<style>
:root{
  font-family:Lexend,"Century Gothic",Futura,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --bg:#101722; --panel:#192538; --panel2:#142136; --line:#3f5168;
  --text:#edf4fb; --muted:#afc2d5; --red:#8a2f3e; --red2:#ef6d7a;
  --personal:#6fa8ff; --promo:#f0bd6b; --spam:#e986a0; --white:#fff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text)}
.shell{width:min(1180px,calc(100% - 34px));margin:auto;padding:20px 0 56px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid #39495d;padding-bottom:18px}
.brand h1{font-size:42px;line-height:1;margin:0;letter-spacing:.05em}
.brandrow{display:flex;align-items:center;gap:13px}
.dog{width:78px;height:75px;object-fit:contain;flex:none}
.brand p{margin:7px 0 0;font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive;font-style:italic}
.topright{font-size:23px;font-weight:900}

.process-wrap{margin-top:22px}
.process-title{font-size:13px;letter-spacing:.13em;text-transform:uppercase;font-weight:900;margin-bottom:10px}
.process{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.light{background:#231a1f;border:2px solid #6a303a;border-radius:15px;padding:20px 15px;text-align:center;min-height:92px;display:flex;flex-direction:column;justify-content:center}
.light .num{font-size:26px;font-weight:950;line-height:1}
.light .label{font-size:14px;font-weight:900;letter-spacing:.09em;margin-top:7px}
.light.active{background:#7a2635;border-color:var(--red2);box-shadow:0 0 0 2px rgba(239,109,122,.15) inset}
.light.active .num,.light.active .label{color:#fff}
.light.dim{opacity:.55}
.page-progress{text-align:center;color:#c8d7e5;font-size:13px;font-weight:800;letter-spacing:.07em;margin:14px 0 10px}
.divider{height:4px;background:#fff;border-radius:99px;margin:8px 0 16px}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.tab{border:1px solid #4a5e77;background:#172337;color:#c5d8e9;border-radius:9px;padding:10px 16px;font-size:13px;font-weight:850}
.tab.active{background:#edf5fd;color:#152235;border-color:#edf5fd}

.intro{background:#1a283b;border:1px solid #3d516a;border-radius:16px;padding:20px 22px;margin-bottom:18px}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:900;color:#9eb8d3}
.intro h2{font-size:31px;margin:5px 0 8px;letter-spacing:-.03em}
.intro p{margin:0;color:#c0d1e2;line-height:1.6}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:18px}
.panel h3{margin:0 0 8px;font-size:24px}
.small{font-size:15px;color:var(--muted);line-height:1.5}
.labelpill{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:900;letter-spacing:.04em}
.labelpill.personal{background:#203a59;color:#dcebff;border:1px solid var(--personal)}
.labelpill.promotional{background:#4a3920;color:#ffe7b8;border:1px solid var(--promo)}
.labelpill.spam{background:#4a2531;color:#ffd6df;border:1px solid var(--spam)}

.sentences{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
.sentence{background:var(--panel2);border:1px solid #43556d;border-radius:11px;padding:13px}
.sentence .txt{font-weight:800;font-size:16px;line-height:1.4;margin-bottom:12px}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.choice{
  border-radius:9px;
  padding:11px 8px;
  font-size:14px;
  font-weight:950;
  background:#172234;
  color:#c7d4e2;
  transition:background .12s ease,border-color .12s ease,box-shadow .12s ease,color .12s ease;
}
.choice.personal{border:1px solid #3d628c}
.choice.promotional{border:1px solid #7c602f}
.choice.spam{border:1px solid #7a4050}
.choice.personal.sel{
  background:var(--personal);
  border-color:#d7e8ff;
  color:#0c1824;
  box-shadow:0 0 0 2px rgba(255,255,255,.24) inset,0 0 16px rgba(111,168,255,.48);
}
.choice.promotional.sel{
  background:var(--promo);
  border-color:#ffe2aa;
  color:#2c210d;
  box-shadow:0 0 0 2px rgba(255,255,255,.22) inset,0 0 16px rgba(240,189,107,.44);
}
.choice.spam.sel{
  background:var(--spam);
  border-color:#ffd1dc;
  color:#2b111c;
  box-shadow:0 0 0 2px rgba(255,255,255,.22) inset,0 0 16px rgba(233,134,160,.44);
}



.actions{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:18px;flex-wrap:wrap}
.count{font-size:14px;color:#d6e2ee;font-weight:800}
.primary{border:1px solid #f1f7fd;background:#f1f7fd;color:#152235;border-radius:12px;padding:14px 20px;font-weight:950}
.primary:disabled{opacity:.34;cursor:not-allowed;box-shadow:none}
.train-big{font-size:24px;padding:22px 38px;min-width:270px;border-radius:15px;box-shadow:0 4px 0 rgba(0,0,0,.24)}
.secondary{border:1px solid #52647c;background:#172337;color:#dce8f4;border-radius:10px;padding:12px 18px;font-weight:850}

.inspect-grid{display:grid;grid-template-columns:1fr 1.05fr;gap:18px}
.words{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.word{background:#111d2f;color:#dce8f4;border:1px solid #51647e;border-radius:8px;padding:10px;font-weight:850}
.word:hover,.word.active{background:#eaf4ff;color:#142235;border-color:#fff}
.barrow{display:grid;grid-template-columns:110px 1fr 38px;gap:10px;align-items:center;margin:12px 0}
.track{height:17px;background:#0f1a29;border-radius:999px;overflow:hidden}
.fill{height:100%;border-radius:999px}
.fill.personal{background:var(--personal)}
.fill.promotional{background:var(--promo)}
.fill.spam{background:var(--spam)}
.testmsg{font-size:24px;font-weight:900;line-height:1.5;margin:14px 0}
.hl{padding:2px 4px;border-radius:4px}
.hl.personal{background:#21456f}
.hl.promotional{background:#5c4725}
.hl.spam{background:#5d2c3a}
.hl.unknown{color:#718093;text-decoration:line-through}
.results-box{background:#111d2f;border:1px solid #51647e;border-radius:11px;padding:16px;margin-top:14px}

.page-nav{display:flex;justify-content:flex-end;margin-top:20px}

@media(max-width:850px){
  .process{grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
  .light{min-height:70px;padding:10px 5px;border-radius:10px}
  .light .num{font-size:19px}
  .light .label{font-size:10px;letter-spacing:.03em;margin-top:5px}
  .sentences,.inspect-grid{grid-template-columns:1fr}
}
@media(max-width:560px){
  .shell{width:calc(100% - 18px)}
  .process{gap:4px}
  .light{min-height:62px;padding:8px 2px}
  .light .num{font-size:16px}
  .light .label{font-size:8px;letter-spacing:0}
  .dog{width:58px;height:56px}
  .brand h1{font-size:31px}
  .brand p{font-size:12px}
  .topright{font-size:16px}
}

.part2-launch{
  width:100%;
  margin:0 0 18px;
  padding:18px 22px;
  border-radius:14px;
  border:2px solid #ffd166;
  background:#ffd166;
  color:#172033;
  font-size:24px;
  font-weight:950;
  letter-spacing:.02em;
  box-shadow:0 4px 0 rgba(0,0,0,.22);
}
.part2-launch:hover{filter:brightness(1.04)}
.part2-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 18px}
.part2-tab{
  border:1px solid #53677f;background:#162337;color:#dce8f4;
  padding:11px 14px;border-radius:9px;font-weight:900;
}
.part2-tab.active{background:#edf5fd;color:#152235;border-color:#edf5fd}
.part2-tab:hover{border-color:#edf5fd;transform:translateY(-1px)}
.part2-tab:focus-visible,.p2-wordbtn:focus-visible,#p2RunTest:focus-visible,#p2Export:focus-visible{outline:3px solid #fff;outline-offset:2px}
.p2-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.p2-row{background:#142136;border:1px solid #41536a;border-radius:10px;padding:12px}
.p2-label{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:900}
.p2-label.personal{background:#203a59;color:#dcebff;border:1px solid var(--personal)}
.p2-label.promotional{background:#4a3920;color:#ffe7b8;border:1px solid var(--promo)}
.p2-label.spam{background:#4a2531;color:#ffd6df;border:1px solid var(--spam)}
.p2-wordgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.p2-wordbtn{background:#111d2f;color:#dce8f4;border:1px solid #51647e;border-radius:8px;padding:10px;font-weight:850}
.p2-wordbtn.active{background:#edf5fd;color:#152235;border-color:#fff}
.p2-testlog{display:grid;gap:8px;margin-top:14px}
.p2-testitem{background:#142136;border:1px solid #41536a;border-radius:9px;padding:10px}
.p2-challenge{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.p2-challenge-group{background:#142136;border:1px solid #41536a;border-radius:11px;padding:14px}
.p2-challenge-group h4{margin:0 0 10px}
.p2-challenge-group textarea{
 width:100%;min-height:74px;resize:vertical;background:#111d2f;color:#fff;border:1px solid #52647e;border-radius:8px;padding:10px;font:inherit
}
.p2-export{margin-top:18px;background:#1a283b;border:1px solid #41536a;border-radius:12px;padding:16px}
.p2-export input{margin-top:8px}
@media(max-width:820px){
 .p2-grid,.p2-challenge{grid-template-columns:1fr}
 .p2-wordgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
}

</style>
</head>

function p2Esc(text){
  return String(text??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}
function p2Words(text){
  const stop=new Set(["a","an","the","is","at","on","in","of","to","and"]);
  return String(text||"")
    .toLowerCase()
    .replace(/[^a-z0-9\s]/g," ")
    .split(/\s+/)
    .filter(w=>w && !stop.has(w));
}
function buildP2Counts(){
  const c={};
  p2Dataset.forEach(([text,label])=>{
    p2Words(text).forEach(w=>{
      c[w] ||= {Personal:0,Promotional:0,Spam:0};
      c[w][label]++;
    });
  });
  return c;
}
function p2Predict(text){
  const counts=buildP2Counts();
  const labs=["Personal","Promotional","Spam"];
  const totals={}, docs={};
  labs.forEach(l=>{
    totals[l]=Object.values(counts).reduce((s,o)=>s+(o[l]||0),0);
    docs[l]=p2Dataset.filter(x=>x[1]===l).length;
  });
  const V=Math.max(1,Object.keys(counts).length);
  const toks=p2Words(text);
  const log={};
  labs.forEach(l=>{
    log[l]=Math.log(docs[l]/p2Dataset.length);
    toks.forEach(w=>{
      if(counts[w]) log[l]+=Math.log(((counts[w][l]||0)+1)/(totals[l]+V));
    });
  });
  const max=Math.max(...labs.map(l=>log[l]));
  const ex={}; let sum=0;
  labs.forEach(l=>{ex[l]=Math.exp(log[l]-max);sum+=ex[l]});
  const probs={}; labs.forEach(l=>probs[l]=ex[l]/sum);
  const pred=labs.slice().sort((a,b)=>probs[b]-probs[a])[0];
  return {pred,probs,toks,counts};
}

  case "dataset": html=datasetPage(); break;
  case "train": html=trainPage("initial"); break;
  case "test": html=testPage("first"); break;
  case "inspect": html=inspectPage(1); break;
  case "retrain": html=trainPage("retrain"); break;
  case "retest": html=testPage("retest"); break;
  case "inspect2": html=inspectPage(2); break;
  case "testnew": html=testPage("new"); break;
  case "autotrain": html=trainPage("auto"); break;
  case "inspect3": html=inspectPage(3); break;
  case "evaluate": html=evaluatePage(); break;
 }
 document.getElementById("app").innerHTML=html;

 document.querySelectorAll(".choice[data-i]").forEach(btn=>btn.addEventListener("click",()=>{
   selected[+btn.dataset.i]=btn.dataset.l; render();
 }));
 const p2Launch=document.getElementById("part2Launch");
 if(p2Launch) p2Launch.addEventListener("click",()=>{part2Mode=true;renderPart2()});
 const datasetNext=document.getElementById("datasetNext");
 if(datasetNext) datasetNext.addEventListener("click",next);

 document.querySelectorAll("[data-testmode]").forEach(btn=>btn.addEventListener("click",()=>{
   let arr=testSelected;
   if(btn.dataset.testmode==="retest") arr=retestSelected;
   if(btn.dataset.testmode==="new") arr=newTestSelected;
   arr[+btn.dataset.i]=btn.dataset.l;
   render();
 }));
 const testNext=document.getElementById("testNext");
 if(testNext) testNext.addEventListener("click",next);

 document.querySelectorAll("[data-retrain]").forEach(btn=>btn.addEventListener("click",()=>{
   retrainSelected[+btn.dataset.retrain]=btn.dataset.l;
   render();
 }));
 const retrainBtn=document.getElementById("retrainBtn");
 if(retrainBtn) retrainBtn.addEventListener("click",()=>{retrainBtn.textContent="RETRAINING...";setTimeout(next,550)});

 const autoTrainBtn=document.getElementById("autoTrainBtn");
 if(autoTrainBtn) autoTrainBtn.addEventListener("click",()=>{autoTrainBtn.textContent="ADDING DATA...";setTimeout(next,550)});

 document.querySelectorAll("[data-word]").forEach(btn=>btn.addEventListener("click",()=>{
   inspectWord=btn.dataset.word;
   render();
 }));
 const prevResult=document.getElementById("prevResult");
 if(prevResult) prevResult.addEventListener("click",()=>{inspectResult=(inspectResult+2)%3;render()});
 const nextResult=document.getElementById("nextResult");
 if(nextResult) nextResult.addEventListener("click",()=>{inspectResult=(inspectResult+1)%3;render()});
 const trainBtn=document.getElementById("trainBtn");
 if(trainBtn) trainBtn.addEventListener("click",()=>{trainBtn.textContent="Training...";setTimeout(next,550)});
 const nextBtn=document.getElementById("nextBtn"); if(nextBtn) nextBtn.addEventListener("click",next);
 const backBtn=document.getElementById("backBtn"); if(backBtn) backBtn.addEventListener("click",back);
}
render();
</script>
</body>
</html>
